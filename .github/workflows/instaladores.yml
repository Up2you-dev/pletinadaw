# Instaladores de Windows: motor + interfaz empaquetados con electron-builder
# (NSIS, portable y zip). Se lanza a mano o al etiquetar una versión; los
# artefactos quedan colgados del run (y del release, si el disparo fue un tag
# o el disparo manual trae etiqueta — en ese caso el release crea el tag
# sobre el commit del run, útil cuando quien lanza no puede empujar tags).
name: instaladores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release (p. ej. v0.1.0); vacía = solo artefactos'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: instaladores · Windows
    runs-on: windows-latest
    timeout-minutes: 120
    # El último paso crea (o completa) el release del tag: necesita escribir.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: caché de dependencias descargadas (JUCE y Tracktion)
        uses: actions/cache@v4
        with:
          path: motor/build/_deps
          key: deps-windows-${{ hashFiles('motor/CMakeLists.txt') }}

      - name: compilar el motor
        run: |
          cmake -B motor/build -S motor
          cmake --build motor/build --config Release

      - name: autoprueba del motor
        run: motor/build/pletina-motor_artefacts/Release/pletina-motor.exe --prueba

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: empaquetar la interfaz con el motor dentro
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run empaquetar

      - uses: actions/upload-artifact@v4
        with:
          name: pletina-daw-windows
          path: |
            ui/dist/PletinaDAW-*-instalador.exe
            ui/dist/PletinaDAW-*-portable.exe
            ui/dist/*.zip
          if-no-files-found: error

      - name: colgar del release si esto es un tag (o el disparo trae etiqueta)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            ui/dist/PletinaDAW-*-instalador.exe
            ui/dist/PletinaDAW-*-portable.exe
            ui/dist/*.zip
